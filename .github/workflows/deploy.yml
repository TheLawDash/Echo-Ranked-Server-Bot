name: Build and deploy Echo Ranked Server Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: echo-ranked-server-bot-minikube
  cancel-in-progress: false

env:
  KUBE_CONTEXT: minikube
  NAMESPACE: law-general-bots
  RELEASE_NAME: echo-ranked-server-bot

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Choose image name and tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/echo-ranked-server-bot" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Minikube
    needs: build
    runs-on:
      - self-hosted
      - linux
      - law-general-bots
    environment: minikube
    permissions:
      contents: read
      packages: read
    env:
      BOT_REPLICA_COUNT: ${{ vars.BOT_REPLICA_COUNT || '1' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create or update namespace
        shell: bash
        run: kubectl --context "$KUBE_CONTEXT" apply -f infrastructure/namespace.yaml

      - name: Verify deployment context
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "$KUBE_CONTEXT" cluster-info
          helm version
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" get secret ghcr-credentials
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" get secret echo-ranked-server-bot-secrets
          [[ "$BOT_REPLICA_COUNT" =~ ^[01]$ ]]

      - name: Validate Kubernetes application credentials
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" get secret echo-ranked-server-bot-secrets -o json | python3 -c '
          import base64
          import json
          import sys
          secret = json.load(sys.stdin).get("data", {})
          required = {
              "EchoRankedDiscordToken",
              "EchoRankedNakamaHttpKey",
              "EchoRankedNakamaPassword",
              "EchoRankedNakamaUsername",
              "EchoRankedNeatQueueApiKey",
              "EchoRankedPostgresConnection",
              "Logging__LogLevel__Default",
              "Logging__LogLevel__Microsoft.EntityFrameworkCore",
              "Nakama__MatchDataSource",
              "Nakama__MatchDetailEndpoint",
              "Nakama__PlayerStatisticsEndpoint",
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
              "POSTGRES_DB",
              "appsettings.json",
          }
          if set(secret) != required:
              raise SystemExit("The Kubernetes secret key set is invalid.")
          if not all(base64.b64decode(secret[name]) for name in required):
              raise SystemExit("A required Kubernetes secret value is empty.")
          print("SECRET_CONFIGURATION_OK")
          '

      - name: Deploy Helm release
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          helm upgrade --install "$RELEASE_NAME" infrastructure/helm/echo-ranked-server-bot \
            --kube-context "$KUBE_CONTEXT" \
            --namespace "$NAMESPACE" \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --set replicaCount="$BOT_REPLICA_COUNT" \
            --wait \
            --timeout 15m
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" rollout status statefulset/echo-ranked-postgres --timeout=15m

      - name: Restart after secret rotation and verify rollout
        if: ${{ env.BOT_REPLICA_COUNT != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" rollout restart deployment/echo-ranked-server-bot
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" rollout status deployment/echo-ranked-server-bot --timeout=15m
