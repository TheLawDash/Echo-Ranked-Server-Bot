name: Build and deploy Echo Ranked Server Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: echo-ranked-server-bot-minikube
  cancel-in-progress: false

env:
  KUBE_CONTEXT: minikube
  NAMESPACE: law-general-bots
  RELEASE_NAME: echo-ranked-server-bot

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Choose image name and tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/echo-ranked-server-bot" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Minikube
    needs: build
    runs-on:
      - self-hosted
      - linux
      - law-general-bots
    environment: minikube
    permissions:
      contents: read
      packages: read
    env:
      BOT_REPLICA_COUNT: ${{ vars.BOT_REPLICA_COUNT || '1' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create or update namespace
        shell: bash
        run: kubectl --context "$KUBE_CONTEXT" apply -f infrastructure/namespace.yaml

      - name: Verify deployment context
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "$KUBE_CONTEXT" cluster-info
          helm version
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" get secret ghcr-credentials
          [[ "$BOT_REPLICA_COUNT" =~ ^[01]$ ]]

      - name: Sync application credentials to Kubernetes
        shell: bash
        env:
          ECHO_RANKED_DISCORD_TOKEN: ${{ secrets.ECHO_RANKED_DISCORD_TOKEN }}
          ECHO_RANKED_NAKAMA_HTTP_KEY: ${{ secrets.ECHO_RANKED_NAKAMA_HTTP_KEY }}
          ECHO_RANKED_NAKAMA_PASSWORD: ${{ secrets.ECHO_RANKED_NAKAMA_PASSWORD }}
          ECHO_RANKED_NAKAMA_USERNAME: ${{ secrets.ECHO_RANKED_NAKAMA_USERNAME }}
          ECHO_RANKED_NEAT_QUEUE_API_KEY: ${{ secrets.ECHO_RANKED_NEAT_QUEUE_API_KEY }}
          ECHO_RANKED_POSTGRES_CONNECTION: ${{ secrets.ECHO_RANKED_POSTGRES_CONNECTION }}
          LOGGING_LEVEL_DEFAULT: ${{ secrets.LOGGING_LEVEL_DEFAULT }}
          LOGGING_LEVEL_EF_CORE: ${{ secrets.LOGGING_LEVEL_EF_CORE }}
          NAKAMA_MATCH_DATA_SOURCE: ${{ secrets.NAKAMA_MATCH_DATA_SOURCE }}
          NAKAMA_MATCH_DETAIL_ENDPOINT: ${{ secrets.NAKAMA_MATCH_DETAIL_ENDPOINT }}
          NAKAMA_PLAYER_STATISTICS_ENDPOINT: ${{ secrets.NAKAMA_PLAYER_STATISTICS_ENDPOINT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          set -euo pipefail
          export APPSETTINGS_JSON_BASE64="$(
            kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" \
              get secret echo-ranked-server-bot-secrets \
              -o jsonpath='{.data.appsettings\.json}'
          )"
          test -n "$APPSETTINGS_JSON_BASE64"
          python3 - <<'PY' | kubectl --context "$KUBE_CONTEXT" apply -f -
          import base64
          import json
          import os
          import sys

          mapping = {
              "EchoRankedDiscordToken": "ECHO_RANKED_DISCORD_TOKEN",
              "EchoRankedNakamaHttpKey": "ECHO_RANKED_NAKAMA_HTTP_KEY",
              "EchoRankedNakamaPassword": "ECHO_RANKED_NAKAMA_PASSWORD",
              "EchoRankedNakamaUsername": "ECHO_RANKED_NAKAMA_USERNAME",
              "EchoRankedNeatQueueApiKey": "ECHO_RANKED_NEAT_QUEUE_API_KEY",
              "EchoRankedPostgresConnection": "ECHO_RANKED_POSTGRES_CONNECTION",
              "Logging__LogLevel__Default": "LOGGING_LEVEL_DEFAULT",
              "Logging__LogLevel__Microsoft.EntityFrameworkCore": "LOGGING_LEVEL_EF_CORE",
              "Nakama__MatchDataSource": "NAKAMA_MATCH_DATA_SOURCE",
              "Nakama__MatchDetailEndpoint": "NAKAMA_MATCH_DETAIL_ENDPOINT",
              "Nakama__PlayerStatisticsEndpoint": "NAKAMA_PLAYER_STATISTICS_ENDPOINT",
          }
          string_data = {key: os.environ[source] for key, source in mapping.items()}
          string_data.update({
              "POSTGRES_USER": os.environ["POSTGRES_USER"],
              "POSTGRES_PASSWORD": os.environ["POSTGRES_PASSWORD"],
              "POSTGRES_DB": os.environ["POSTGRES_DB"],
              "appsettings.json": base64.b64decode(
                  os.environ["APPSETTINGS_JSON_BASE64"]
              ).decode("utf-8"),
          })
          if not all(string_data.values()):
              raise SystemExit("A required deployment secret is empty.")
          json.loads(string_data["appsettings.json"])
          print(json.dumps({
              "apiVersion": "v1",
              "kind": "Secret",
              "metadata": {
                  "name": "echo-ranked-server-bot-secrets",
                  "namespace": os.environ["NAMESPACE"],
                  "labels": {"app.kubernetes.io/part-of": "law-general-bots"},
              },
              "type": "Opaque",
              "stringData": string_data,
          }))
          PY

      - name: Deploy Helm release
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          helm upgrade --install "$RELEASE_NAME" infrastructure/helm/echo-ranked-server-bot \
            --kube-context "$KUBE_CONTEXT" \
            --namespace "$NAMESPACE" \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --set replicaCount="$BOT_REPLICA_COUNT" \
            --wait \
            --timeout 15m
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" rollout status statefulset/echo-ranked-postgres --timeout=15m

      - name: Restart after secret rotation and verify rollout
        if: ${{ env.BOT_REPLICA_COUNT != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" rollout restart deployment/echo-ranked-server-bot
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" rollout status deployment/echo-ranked-server-bot --timeout=15m
