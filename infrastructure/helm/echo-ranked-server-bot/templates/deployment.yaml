apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "echo-ranked-server-bot.fullname" . }}
  labels:
    {{- include "echo-ranked-server-bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "echo-ranked-server-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "echo-ranked-server-bot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: law-general-bots
    spec:
      serviceAccountName: {{ include "echo-ranked-server-bot.serviceAccountName" . }}
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: POSTGRES_DB
          command:
            - sh
            - -ec
            - until pg_isready -h {{ .Values.postgres.serviceName }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
{{- range $name := list "EchoRankedDiscordToken" "EchoRankedNakamaHttpKey" "EchoRankedNakamaPassword" "EchoRankedNakamaUsername" "EchoRankedNeatQueueApiKey" "EchoRankedPostgresConnection" "Logging__LogLevel__Default" "Logging__LogLevel__Microsoft.EntityFrameworkCore" "Nakama__MatchDataSource" "Nakama__MatchDetailEndpoint" "Nakama__PlayerStatisticsEndpoint" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: {{ $name }}
{{- end }}
          volumeMounts:
            - name: configuration
              mountPath: /app/appsettings.json
              subPath: appsettings.json
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: configuration
          secret:
            secretName: {{ .Values.secrets.existingSecret }}
            items:
              - key: appsettings.json
                path: appsettings.json
      terminationGracePeriodSeconds: 30
