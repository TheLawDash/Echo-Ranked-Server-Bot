replicaCount: 1

image:
  repository: ghcr.io/thelawdash/echo-ranked-server-bot
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-credentials

fullnameOverride: echo-ranked-server-bot

# Font file on the bot's data volume; the scoreboard falls back to Arial when it is missing
scoreboardFontPath: /app/data/fonts/conthrax-sb.ttf

# Layout matching the bundled scoreboard template
scoreboardLayout: Framed

serviceAccount:
  create: true
  name: ""

secrets:
  existingSecret: echo-ranked-server-bot-secrets

botStorage:
  storageClass: standard
  size: 1Gi

postgres:
  image: postgres:17-alpine
  serviceName: echo-ranked-postgres
  storage:
    storageClass: standard
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi
